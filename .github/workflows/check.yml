name: Check SDK
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      require_consumers:
        type: boolean
        default: false
      host_ref:
        type: string
        default: ""
      tools_ref:
        type: string
        default: ""
permissions:
  contents: read
jobs:
  sdk:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:archive
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.os }}
          path: artifacts/
  consumers:
    needs: sdk
    if: inputs.require_consumers || ((inputs.host_ref != '' || vars.LOMI_HOST_REF != '') && (inputs.tools_ref != '' || vars.LOMI_TOOLS_REF != ''))
    runs-on: ubuntu-latest
    steps:
      - name: Require pinned consumers
        env:
          HOST_REF: ${{ inputs.host_ref || vars.LOMI_HOST_REF }}
          TOOLS_REF: ${{ inputs.tools_ref || vars.LOMI_TOOLS_REF }}
        run: |
          [[ "$HOST_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TOOLS_REF" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          path: plugin-sdk
      - uses: actions/checkout@v4
        with:
          repository: lomi-dev/lomi
          ref: ${{ inputs.host_ref || vars.LOMI_HOST_REF }}
          path: lomi
      - uses: actions/checkout@v4
        with:
          repository: lomi-dev/plugin-tools
          ref: ${{ inputs.tools_ref || vars.LOMI_TOOLS_REF }}
          path: plugin-tools
      - uses: actions/download-artifact@v4
        with:
          name: sdk-ubuntu-latest
          path: sdk-artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - run: node plugin-sdk/scripts/test-consumers.mjs lomi plugin-tools sdk-artifacts
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked plugins::tests
        working-directory: lomi
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: lomi
      - run: pnpm test:ui -- tests/ui/plugins.spec.ts tests/ui/plugin-authoring.spec.ts
        working-directory: lomi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-validation
          path: |
            plugin-sdk/artifacts/
            plugin-tools/artifacts/archive-validation.json
            lomi/test-results/
