name: Publish SDK next
on:
  workflow_dispatch:
    inputs:
      host_ref:
        description: Full reviewed commit in lomi-dev/lomi
        type: string
        required: true
      tools_ref:
        description: Full reviewed commit in lomi-dev/plugin-tools
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: publish-sdk
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main' && vars.NPM_PUBLISH_READY == 'true'
    uses: ./.github/workflows/check.yml
    with:
      require_consumers: true
      host_ref: ${{ inputs.host_ref }}
      tools_ref: ${{ inputs.tools_ref }}
  publish:
    needs: validate
    environment: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: sdk-ubuntu-latest
          path: artifacts
      - run: node scripts/verify-release.mjs artifacts
      - run: npm install --global npm@11.5.1
      - run: npm publish ./artifacts/*.tgz --access public --tag next --provenance
